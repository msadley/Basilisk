services:
  relay:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: relay
      network: host
    container_name: basilisk_relay
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "127.0.0.1:4002:4002"
    volumes:
      - ./data:/home/basilisk/.basilisk
      - ./cache:/home/basilisk/.cache
    env_file:
      - .env
    profiles: ["relay"]

  test:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: test
    container_name: basilisk_test
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "127.0.0.1:4002:4002"
    volumes:
      - ./data:/home/basilisk/.basilisk
      - ./cache:/home/basilisk/.cache
    env_file:
      - .env
    profiles: ["test"]
